name: Test
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: jdx/mise-action@v4.2.0 # zizmor: ignore[unpinned-uses] immutable tag
    - run: mise lint
    - uses: ./
