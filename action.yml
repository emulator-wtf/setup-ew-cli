name: setup-ew-cli
description: Setup the ew-cli command to run Android instrumentation tests with emulator.wtf
inputs:
  version:
    description: Version of ew-cli to install
    required: false
    default: 1.3.0
branding:
  color: orange
  icon: smartphone
runs:
  using: composite
  steps:
    - uses: emulator-wtf/actions/setup-ew-cli@1a96fbe11f971a7f9da7d5e80eda476909224c78  # v1.0.1
      with:
        version: ${{ inputs.version }}
